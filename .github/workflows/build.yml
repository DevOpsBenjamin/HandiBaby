name: PWA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Called directly rather than through `npm run lint`, whose --fix flag
      # would silently repair violations instead of failing the build.
      - name: Run oxlint
        run: npx oxlint .

      - name: Run ESLint
        run: npx eslint .

      - name: Run Vitest Unit Tests
        run: npm run test:unit -- --run

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Deliberately built without the Supabase variables: this proves the
      # offline-only path still compiles. Cloudflare Pages owns the real
      # production build and injects its own environment.
      - name: Run Build
        run: npm run build
